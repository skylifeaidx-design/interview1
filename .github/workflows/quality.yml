name: 가이드북 품질 검증
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: guide-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - run: npm run build
